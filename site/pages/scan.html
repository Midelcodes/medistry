    <link rel="stylesheet" href="/css/scan.css">
    <script type="application/json" id="medistry-jwks">{{jwksJson}}</script>
    <script type="application/json" id="medistry-scan-i18n">{{scanI18nJson}}</script>

    <section class="scan-page content-container">
      <div class="scan-top">
        <h1 class="scan-title" data-i18n="scan_title">Emergency card scanner</h1>
        <span id="net-status" class="net-pill" role="status" aria-live="polite"></span>
      </div>
      <p class="scan-intro" data-i18n="scan_intro">Scan a Medistry emergency card. The signature is checked on this device and nothing is sent to a server.</p>

      <div id="scan-input" class="scan-input">
        <div class="scan-actions">
          <button type="button" class="scan-btn primary" id="cam-start" data-i18n="scan_start_camera">Scan with camera</button>
          <button type="button" class="scan-btn" id="cam-stop" data-i18n="scan_stop_camera" hidden>Stop camera</button>
        </div>
        <div class="camera-box" id="camera-box" hidden>
          <video id="cam-video" playsinline muted aria-label="Camera preview"></video>
          <p class="scan-hint" data-i18n="scan_aim">Point the camera at the QR code on the front of the card.</p>
        </div>
        <p id="scan-msg" class="scan-msg" role="status" aria-live="polite"></p>

        <form id="paste-form" class="paste-form" autocomplete="off">
          <label for="paste-input" data-i18n="scan_paste_label">Or paste the card link or code</label>
          <textarea id="paste-input" rows="3" spellcheck="false" autocapitalize="off"></textarea>
          <button type="submit" class="scan-btn" data-i18n="scan_verify">Verify</button>
        </form>
      </div>

      <div id="scan-result" class="scan-result" hidden></div>
      <noscript><p class="scan-msg">The scanner needs JavaScript to check the card signature.</p></noscript>
    </section>
