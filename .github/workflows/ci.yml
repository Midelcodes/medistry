name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No secrets: tests generate ephemeral keys and use synthetic data only.
      - name: Install (root)
        run: npm ci || npm install

      - name: Test (root)
        run: npm test

      - name: Install (mcp)
        working-directory: mcp
        run: npm ci || npm install

      - name: Test (mcp)
        working-directory: mcp
        run: npm test
