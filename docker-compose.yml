services:
  postgres:
    image: postgres:16-alpine
    container_name: medistry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: medistry
      POSTGRES_PASSWORD: medistry_secure_dev
      POSTGRES_DB: medistry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medistry -d medistry"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medistry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Malware scanning for uploads (Phase 14). The app talks to clamd over TCP (CLAMD_HOST=localhost, CLAMD_PORT=3310).
  # On first start freshclam downloads the signature databases, which takes several minutes; clamd answers after that.
  clamav:
    image: clamav/clamav:1.4
    container_name: medistry-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - clamav_data:/var/lib/clamav

volumes:
  postgres_data:
  redis_data:
  clamav_data:

